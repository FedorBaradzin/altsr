# ALTSR — прод-compose для Hostinger Docker Manager (без YAML-якорей).
# Сборка из исходников репозитория, миграции авто, наружу только Caddy (80/443).
# Секретов в файле нет: JWT backend генерирует сам при первом старте.
# Ключи интеграций — через ${VAR} из server-side stack env (Docker Manager),
# по умолчанию пустые/false → безопасный fallback-режим.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: altsr
      POSTGRES_PASSWORD: altsr
      POSTGRES_DB: altsr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altsr"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - deploy/.env.deploy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NOWPAYMENTS_ENABLED: ${NOWPAYMENTS_ENABLED:-false}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        if [ -z "$$JWT_SECRET" ]; then
          [ -f /secrets/jwt ] || python -c 'import secrets;print(secrets.token_hex(32))' > /secrets/jwt
          export JWT_SECRET="$$(cat /secrets/jwt)"
        fi
        alembic upgrade head
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - jwtdata:/secrets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    env_file:
      - deploy/.env.deploy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NOWPAYMENTS_ENABLED: ${NOWPAYMENTS_ENABLED:-false}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  screener:
    build:
      context: ./backend
    env_file:
      - deploy/.env.deploy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NOWPAYMENTS_ENABLED: ${NOWPAYMENTS_ENABLED:-false}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    restart: unless-stopped
    command: ["python", "-m", "app.screen_worker"]
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  signals:
    build:
      context: ./backend
    env_file:
      - deploy/.env.deploy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NOWPAYMENTS_ENABLED: ${NOWPAYMENTS_ENABLED:-false}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    restart: unless-stopped
    command: ["python", "-m", "app.signal_worker"]
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  paper:
    build:
      context: ./backend
    env_file:
      - deploy/.env.deploy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NOWPAYMENTS_ENABLED: ${NOWPAYMENTS_ENABLED:-false}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    restart: unless-stopped
    command: ["python", "-m", "app.paper_worker"]
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy

  ai:
    build:
      context: ./backend
    env_file:
      - deploy/.env.deploy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NOWPAYMENTS_ENABLED: ${NOWPAYMENTS_ENABLED:-false}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    restart: unless-stopped
    command: ["python", "-m", "app.ai_worker"]
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: https://altsr.space
        NEXT_PUBLIC_WS_BASE: wss://altsr.space
        NEXT_PUBLIC_SITE_URL: https://altsr.space
        NEXT_PUBLIC_TELEGRAM_BOT: ${NEXT_PUBLIC_TELEGRAM_BOT:-}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
        NEXT_PUBLIC_GOOGLE_ENABLED: ${NEXT_PUBLIC_GOOGLE_ENABLED:-false}
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    build: ./deploy/caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  jwtdata:
