services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: altsr
      POSTGRES_PASSWORD: altsr
      POSTGRES_DB: altsr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altsr"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://altsr:altsr@postgres:5432/altsr
      REDIS_URL: redis://redis:6379/0
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://altsr:altsr@postgres:5432/altsr
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  screener:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://altsr:altsr@postgres:5432/altsr
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.screen_worker"]
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  signals:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://altsr:altsr@postgres:5432/altsr
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.signal_worker"]
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  paper:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://altsr:altsr@postgres:5432/altsr
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.paper_worker"]
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy

  ai:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://altsr:altsr@postgres:5432/altsr
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.ai_worker"]
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # На проде подставьте ваш домен (эти значения впекаются в бандл при сборке):
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
        NEXT_PUBLIC_WS_BASE: ${NEXT_PUBLIC_WS_BASE:-ws://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://altsr.app}
        NEXT_PUBLIC_TELEGRAM_BOT: ${NEXT_PUBLIC_TELEGRAM_BOT:-}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
