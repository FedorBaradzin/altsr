<script id="altsr-x-js">
(function(){

var EN={eye:'▶ Platform video tour',h:'See how ALTSR works',sub:'Radar, PASS / REVIEW / BLOCK verdicts, token breakdown, auto-trading and pricing — in about ninety seconds.',cta:'Watch the tour →',dur:'~1.5 min · with sound',sece:'Radar · dashboard',sech:'Profit figures — now live',demo:'DEMO',labels:['Paper account','Win-rate','Return','Positions','Realized P&L'],pos:'4 open',vid:'/landing/altsr_tour_en.mp4'};
var RU=null;function q(s){return document.querySelector(s);}function cells(){return document.querySelectorAll('.alnp-strip .alnp-cell');}
function capRU(){var cs=cells();return{eye:(q('.alnp-eye')||{}).textContent,h:(q('.alnp-h')||{}).textContent,sub:(q('.alnp-sub')||{}).textContent,cta:(q('.alnp-cta')||{}).textContent,dur:(q('.alnp-dur')||{}).textContent,sece:(q('.alnp-sece')||{}).textContent,sech:(q('.alnp-sech')||{}).textContent,demo:(q('.alnp-demo')||{}).textContent,labels:[].map.call(cs,function(c){return (c.querySelector('.alnp-l')||{}).textContent;}),pos:cs[3]?(cs[3].querySelector('.alnp-v')||{}).textContent:'',vid:'/landing/altsr_tour_ru.mp4'};}
function setT(sel,t){var e=q(sel);if(e&&t!=null)e.textContent=t;}
function applyL(L){setT('.alnp-eye',L.eye);setT('.alnp-h',L.h);setT('.alnp-sub',L.sub);setT('.alnp-cta',L.cta);setT('.alnp-dur',L.dur);setT('.alnp-sece',L.sece);setT('.alnp-sech',L.sech);setT('.alnp-demo',L.demo);var cs=cells();for(var i=0;i<cs.length;i++){var l=cs[i].querySelector('.alnp-l');if(l&&L.labels&&L.labels[i])l.textContent=L.labels[i];}if(cs[3]){var pv=cs[3].querySelector('.alnp-v');if(pv&&L.pos)pv.textContent=L.pos;}var src=document.getElementById('tourSrc'),vd=document.getElementById('tourVid');if(src&&L.vid&&src.getAttribute('src')!==L.vid){src.setAttribute('src',L.vid);if(vd)try{vd.load()}catch(e){}}}
function lng(){var t=document.body.innerText||'';return /How it works|Auto-trading/.test(t)?'en':'ru';}
