  <!-- cross hairs -->
  <line x1="16" y1="3" x2="16" y2="29" stroke="#8B5CF6" stroke-opacity="0.18" stroke-width="1"/>
  <line x1="3" y1="16" x2="29" y2="16" stroke="#8B5CF6" stroke-opacity="0.18" stroke-width="1"/>
  <!-- sweep arm -->
